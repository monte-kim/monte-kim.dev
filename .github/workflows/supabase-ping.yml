# Keeps the Supabase free-tier project from pausing (1 week of inactivity).
# Runs twice a week; also triggerable manually from the Actions tab.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL      — Project URL (https://xxxx.supabase.co)
#   SUPABASE_ANON_KEY — anon public key

name: supabase-ping

on:
  schedule:
    - cron: "0 3 * * 1,4" # Mon & Thu 03:00 UTC (12:00 KST)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to register activity
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL secret not set — skipping (Supabase not connected yet)"
            exit 0
          fi
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/posts?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
          echo "pinged"
